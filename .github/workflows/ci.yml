name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Raw-ingestion test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -q

  migrations:
    name: Raw schema initializes and migrations are idempotent
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: revops
          POSTGRES_PASSWORD: revops
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://revops:revops@localhost:5432/warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Initialize the raw schema
        env: {PGPASSWORD: revops}
        run: |
          psql -h localhost -U revops -d warehouse -v ON_ERROR_STOP=1 -f db/init.sql
          psql -h localhost -U revops -d warehouse -v ON_ERROR_STOP=1 -f db/02_hubspot_raw.sql
      - name: Apply retained migrations
        run: python scripts/run_db_migrations.py
      - name: Re-run must skip every migration with checksum verification
        run: |
          python scripts/run_db_migrations.py | tee rerun.log
          grep -q "checksum verified" rerun.log
          # A second run must verify and skip; applying again would mean the
          # ledger or checksum comparison is not doing its job.
          ! grep -q "^\[migrate\] apply " rerun.log
      - name: Raw tables exist after migration
        env: {PGPASSWORD: revops}
        run: |
          psql -h localhost -U revops -d warehouse -v ON_ERROR_STOP=1 -c "
            SELECT 'hubspot_deals'::text, count(*) FROM raw.hubspot_deals
            UNION ALL SELECT 'hubspot_campaigns', count(*) FROM raw.hubspot_campaigns
            UNION ALL SELECT 'hubspot_gtm_campaigns', count(*) FROM raw.hubspot_gtm_campaigns
            UNION ALL SELECT 'gtm_campaign_contacts', count(*) FROM raw.hubspot_gtm_campaign_contacts
            UNION ALL SELECT 'gtm_campaign_deals', count(*) FROM raw.hubspot_gtm_campaign_deals;"
