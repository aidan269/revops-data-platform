name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  portable-tests:
    name: Portable test suite (no operational evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        # No operational artifacts, ledger or evidence files exist in CI.
        # Evidence-dependent tests must SKIP, never silently pass.
        env:
          BRAND_INBOUND_CSV: /nonexistent.csv
          BRAND_INBOUND_PDF: /nonexistent.pdf
        run: pytest tests/ -q

  migration-and-safety:
    name: Migrations apply, re-run clean, safety invariants hold
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: revops
          POSTGRES_PASSWORD: revops
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Create base schemas
        env: {PGPASSWORD: revops}
        run: |
          psql -h localhost -U revops -d warehouse -v ON_ERROR_STOP=1 -f db/init.sql
          psql -h localhost -U revops -d warehouse -v ON_ERROR_STOP=1 -f db/02_hubspot_raw.sql
      - name: Apply migrations
        env: {DATABASE_URL: postgresql://revops:revops@localhost:5432/warehouse}
        run: python scripts/run_db_migrations.py
      - name: Re-run must skip with checksum verification
        env: {DATABASE_URL: postgresql://revops:revops@localhost:5432/warehouse}
        run: |
          python scripts/run_db_migrations.py | tee rerun.log
          grep -q "checksum verified" rerun.log
          ! grep -q "apply " rerun.log
      - name: Graph validation
        run: python -m automation_twin.cli validate-graph
      - name: Loader is idempotent and refresh-safe
        env: {DATABASE_URL: postgresql://revops:revops@localhost:5432/warehouse}
        run: |
          python scripts/load_automation_twin.py
          python scripts/load_automation_twin.py | tee reload.log
          grep -q '"inserted": 0' reload.log
      - name: Safety invariants
        run: |
          python - <<'PY'
          from automation_twin.policy import assert_no_production_adapter
          assert_no_production_adapter()
          from automation_twin import cli
          assert "execute" not in cli.__doc__.split("Commands:")[1].split("\n")[1]
          print("no production adapter; no execute command")
          PY
