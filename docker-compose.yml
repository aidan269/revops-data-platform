# RevOps raw-data platform — local PostgreSQL warehouse.
#
# `docker compose up -d` starts the warehouse and creates the raw schema plus
# the HubSpot contact/company landing tables. Apply the ordered migrations
# afterwards with `python scripts/run_db_migrations.py`.
services:
  postgres:                     # the raw warehouse
    image: postgres:16
    environment:
      POSTGRES_USER: revops
      POSTGRES_PASSWORD: revops
      POSTGRES_DB: warehouse
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied once, in filename order, on first initialization only.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/02_hubspot_raw.sql:/docker-entrypoint-initdb.d/02_hubspot_raw.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revops -d warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
