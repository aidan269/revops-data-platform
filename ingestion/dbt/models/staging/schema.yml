version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: leads_raw
        loaded_at_field: received_at
        freshness:                      # alerts if the feed silently stops
          warn_after:  {count: 12, period: hour}
          error_after: {count: 24, period: hour}

models:
  - name: stg_leads
    description: One typed row per raw inbound lead event.
    columns:
      - name: event_id
        tests: [not_null, unique]       # idempotency guarantee

      - name: utm_source
        # THE alarm. The 138 corruption was utm_source="utm_medium:" — every
        # value shifted one field over. This test trips the moment a garbage
        # value appears, on day one instead of 15 months later.
        #
        # Wired from live HubSpot utm_source values (Aug 3 2026): the list below
        # is the real, legitimate set present today, so the test passes on real
        # data and WARNS on anything else — which right now means the 138
        # corrupted rows ('utm_medium:') and test pollution ('test','test3',
        # 'test7','test8','source-test').
        tests:
          - accepted_values:
              values: [
                'google','direct','twitter','twitter.com','t.co','x','linkedin',
                'bing','duckduckgo','ecosia','reddit','chatgpt.com','in-app',
                'mail','hs_email','googleads.g.doubleclick.net',
                'cantina-staging.webflow.io','cantina.website','webflow.com',
                'cantina-prod.us.auth0.com','46025408.hs-sites.com','spearbit.com',
                'theblock.co','morpho.org','github.com','medium.com','ethereum.org',
                'lu.ma','luma.com','superteam.fun','bnbchain.org','blog.lido.fi',
                'docs.ethena.fi','docs.megapot.io','docs.size.credit',
                'eggs-finance.gitbook.io','hub.forum.berachain.com',
                'uniswapfoundation.org','solaxy.io','cloudseclist','companionlink.com',
                'techbullion.com','onlinethreatalerts.com','eqchi.r.ag.d.sendibm3.com',
                null ]
              config:
                severity: warn
