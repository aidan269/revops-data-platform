# RevOps dbt project — staging → marts
# Reads from raw schema, builds analytics schema models.

name: revops
version: "1.0.0"
config-version: 2

profile: revops

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - target
  - dbt_packages

models:
  revops:
    staging:
      +schema: analytics
      +materialized: view
    intermediate:
      +schema: analytics
      +materialized: view
    marts:
      +schema: analytics
      +materialized: table

seeds:
  revops:
    gtm_deal_motion_overrides:
      +column_types:
        deal_id: varchar
        customer_motion: varchar
        evidence_note: varchar
        reviewed_by: varchar
        reviewed_at: varchar
