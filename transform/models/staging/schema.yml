version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: hubspot_contacts
        description: "Append-only HubSpot contact snapshots. Latest per id selected by staging."
        loaded_at_field: extracted_at
      - name: hubspot_companies
        description: "Append-only HubSpot company snapshots. Latest per id selected by staging."
        loaded_at_field: extracted_at
      - name: hubspot_contact_company_map
        description: "Contact-to-company associations."
        loaded_at_field: extracted_at
      - name: hubspot_deals
        description: "Append-only HubSpot deal snapshots. hs_is_closed_won carried as-is."
        loaded_at_field: extracted_at
      - name: hubspot_deal_contacts
        description: "Deal-to-contact associations for channel attribution."
        loaded_at_field: extracted_at
      - name: hubspot_deal_stages
        description: "Append-only HubSpot deal pipeline and stage metadata."
        loaded_at_field: extracted_at
      - name: hubspot_deal_companies
        description: "Direct HubSpot deal-to-company associations."
        loaded_at_field: extracted_at
      - name: hubspot_campaigns
        description: "Append-only HubSpot campaign snapshots (native Marketing Campaign object)."
        loaded_at_field: extracted_at
      - name: hubspot_gtm_campaigns
        description: >
          Append-only snapshots of the GTM Campaigns custom object (2-63647366).
          Distinct from hubspot_campaigns; the two are never mixed.
        loaded_at_field: extracted_at
      - name: hubspot_gtm_campaign_contacts
        description: "GTM Campaign to contact associations, copied exactly as HubSpot reports them."
        loaded_at_field: extracted_at
      - name: hubspot_gtm_campaign_deals
        description: "GTM Campaign to deal associations, copied exactly as HubSpot reports them."
        loaded_at_field: extracted_at
      - name: hubspot_campaign_members
        description: "Campaign-to-contact associations."
        loaded_at_field: extracted_at
      - name: hubspot_engagements
        description: "Append-only engagement events (email_open, email_click, form_submission, meeting)."
        loaded_at_field: extracted_at
      - name: brand_inbound_imports
        description: "BRAND-INBOUND-RECOVERY source metadata. Historical evidence; authorizes no CRM change."
        loaded_at_field: imported_at
      - name: brand_inbound_lines
        description: "All 353 human-maintained CSV rows verbatim. Historical evidence, never CRM truth."
        loaded_at_field: imported_at
      - name: brand_inbound_twitter_crosscheck
        description: "Twitter/X historical-vs-PDF cross-check. PDF has no deal IDs; resolved by deal name."
        loaded_at_field: imported_at


seeds:
  - name: gtm_deal_motion_overrides
    description: "Human-reviewed customer-motion classifications with explicit evidence and reviewer attribution."
    config:
      column_types:
        deal_id: varchar
        customer_motion: varchar
        evidence_note: varchar
        reviewed_by: varchar
        reviewed_at: varchar
    columns:
      - name: deal_id
        tests: [not_null, unique]
      - name: customer_motion
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [net_new_arr, audit_to_arr_conversion, expansion, renewal, other_non_arr]
      - name: evidence_note
        tests: [not_null]
      - name: reviewed_by
        tests: [not_null]
      - name: reviewed_at
        tests: [not_null]

models:
  - name: stg_hubspot_contacts
    description: "Latest snapshot per contact id from raw.hubspot_contacts."
    columns:
      - name: contact_id
        tests: [not_null, unique]
      - name: email
        description: "Source email; null when HubSpot has no email for the contact."

  - name: stg_hubspot_companies
    description: "Latest snapshot per company id from raw.hubspot_companies."
    columns:
      - name: company_id
        tests: [not_null, unique]

  - name: stg_contact_company_map
    description: "Latest contact-company association per contact."
    columns:
      - name: contact_id
        tests: [not_null, unique]

  - name: stg_hubspot_deals
    description: "Latest snapshot per deal id, including nullable CRM-admin readiness fields with extraction provenance."
    config:
      contract:
        enforced: true
    columns:
      - name: deal_id
        data_type: text
        tests: [not_null, unique]
      - name: extracted_at
        data_type: timestamp with time zone
      - name: amount
        data_type: numeric(18,2)
      - name: dealstage
        data_type: text
      - name: pipeline
        data_type: text
      - name: hs_is_closed_won
        data_type: boolean
      - name: createdate
        data_type: timestamp with time zone
      - name: closedate
        data_type: timestamp with time zone
      - name: deal_source
        data_type: text
      - name: original_traffic_source
        data_type: text
        description: >
          Native HubSpot deal Original Traffic Source (hs_analytics_source),
          ingested by CRM-010. Evidence only; it never sets Deal Source.
      - name: deal_owner_id
        data_type: text
        description: "Configured HubSpot owner property; null is preserved."
      - name: next_step
        data_type: text
        description: "Configured HubSpot next-step property; null is preserved."
      - name: next_step_updated_at
        data_type: timestamp with time zone
        description: "Configured next-step date/timestamp property; null is preserved."
      - name: product_service
        data_type: text
        description: "Configured product/service property; null is preserved."
      - name: billing_model
        data_type: text
        description: "Configured billing-model property; null is preserved."
      - name: crm_admin_fields_extracted
        data_type: boolean
        description: "True only for snapshots created after CRM-005 field extraction was enabled."
        tests: [not_null]
      - name: raw_properties
        data_type: jsonb

  - name: stg_deal_contacts
    description: "Latest deal-contact associations."
    columns:
      - name: deal_id
        tests: [not_null]
      - name: contact_id
        tests: [not_null]

  - name: stg_hubspot_deal_stages
    description: "Latest HubSpot stage metadata per pipeline and stage."
    columns:
      - name: pipeline_id
        tests: [not_null]
      - name: stage_id
        tests: [not_null]

  - name: stg_deal_companies
    description: "Latest direct company associations per deal."
    columns:
      - name: deal_id
        tests: [not_null]
      - name: company_id
        tests: [not_null]

  - name: dim_contact
    description: "One row per contact with company fields via association."
    columns:
      - name: contact_id
        tests: [not_null, unique]
      - name: email
        description: "Source email; null when no email is available."

  - name: dim_company
    description: "One row per company (latest snapshot)."
    columns:
      - name: company_id
        tests: [not_null, unique]

  - name: dim_deal
    description: "One row per deal (latest snapshot). hs_is_closed_won carried as-is."
    columns:
      - name: deal_id
        tests: [not_null, unique]

  - name: bridge_deal_contact
    description: "Links deals to contacts for channel attribution."
    columns:
      - name: deal_id
        tests: [not_null]
      - name: contact_id
        tests: [not_null]

  - name: int_contact_channel
    description: "One row per contact with first-touch channel from UTM taxonomy."
    columns:
      - name: contact_id
        tests: [not_null, unique]
      - name: channel
        tests: [not_null]

  - name: mart_enrichment_gaps
    description: "One row per contact with boolean gap flags for hs_seniority, industry, hs_employee_range."
    columns:
      - name: contact_id
        tests: [not_null, unique]
      - name: gap_hs_seniority
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: gap_industry
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: gap_hs_employee_range
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: mart_channel_performance
    description: "One row per channel with contacts, deals, win rate, pipeline $, won $, avg days-to-close."
    columns:
      - name: channel
        tests: [not_null, unique]
      - name: contacts
        tests: [not_null]
      - name: closed_won
        tests: [not_null]
      - name: win_rate_contacts
        tests: [not_null]

  - name: stg_hubspot_campaigns
    description: "Latest snapshot per campaign id."
    columns:
      - name: campaign_id
        tests: [not_null, unique]

  - name: stg_campaign_members
    description: "Latest campaign-contact associations."
    columns:
      - name: campaign_id
        tests: [not_null]
      - name: contact_id
        tests: [not_null]

  - name: stg_hubspot_engagements
    description: "Latest snapshot per engagement id."
    columns:
      - name: engagement_id
        tests: [not_null, unique]
      - name: contact_id
        tests: [not_null]

  - name: fct_touchpoint
    description: "One row per contact-touchpoint — the spine for attribution."
    columns:
      - name: touchpoint_id
        tests: [not_null, unique]
      - name: contact_id
        tests: [not_null]
      - name: channel
        tests: [not_null]

  - name: dim_campaign
    description: "One row per campaign with type + messaging_theme (advisory)."
    columns:
      - name: campaign_id
        tests: [not_null, unique]

  - name: mart_attribution
    description: "Per-touchpoint credit under first-touch, last-touch, and linear multi-touch."
    columns:
      - name: touchpoint_id
        tests: [not_null]
      - name: contact_id
        tests: [not_null]
      - name: deal_id
        tests: [not_null]

  - name: mart_campaign_performance
    description: "Per campaign and campaign type — touchpoints, contacts influenced, pipeline, won $."
    columns:
      - name: campaign_id
        tests: [not_null, unique]

  - name: mart_messaging
    description: "Per messaging_theme — engagement rate + downstream conversion."
    columns:
      - name: messaging_theme
        tests: [not_null]

  - name: int_won_accounts
    description: "One row per closed-won deal with firmographics, channel, seniority, coverage flags."
    columns:
      - name: deal_id
        tests: [not_null, unique]

  - name: mart_icp_profile
    description: "Won vs open vs lost profiles across industry, size, seniority, channel, deal size."
    columns:
      - name: dimension
        tests: [not_null]
      - name: dimension_value
        tests: [not_null]

  - name: mart_icp_fit_score
    description: "Deterministic ICP-fit score on open pipeline (max 100, explainable weighted match)."
    columns:
      - name: deal_id
        tests: [not_null, unique]
      - name: icp_fit_score
        tests: [not_null]

  - name: mart_gtm_lifecycle
    description: "Canonical deal lifecycle with explicit evidence status and reviewed commercial-motion overrides."
    columns:
      - name: deal_id
        tests: [not_null, unique]
      - name: company_history_lifecycle
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [unmapped_company, first_known_company_win, repeat_company_win, not_closed_won]
      - name: customer_motion
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [unclassified, net_new_arr, audit_to_arr_conversion, expansion, renewal, other_non_arr]

  - name: mart_pipeline_health_live
    description: "Live-only deal health by pipeline and stage, including an explicit unmapped bucket."
    columns:
      - name: pipeline_id
        description: "Raw pipeline ID; null when the source deal is unmapped."
      - name: stage_id
        description: "Raw stage ID; null when the source deal is unmapped."

  - name: mart_active_pipeline_hygiene_live
    description: "Live open-deal hygiene queue with CRM-005 extraction provenance; never infers field values."
    columns:
      - name: deal_id
        tests: [not_null, unique]
      - name: priority
        tests:
          - accepted_values:
              arguments:
                values: [P0_high_value_close_risk, P1_close_date_urgent, P2_high_value, P3_standard]
      - name: crm_admin_fields_extracted
        tests: [not_null]
      - name: deal_owner_gap_status
        tests:
          - accepted_values:
              arguments:
                values: [unavailable_in_current_snapshot_not_scored, missing, populated]
      - name: next_step_gap_or_staleness_status
        tests:
          - accepted_values:
              arguments:
                values: [unavailable_in_current_snapshot_not_scored, missing, timestamp_unavailable_not_scored, stale_over_30_days, current]
      - name: product_service_gap_status
        tests:
          - accepted_values:
              arguments:
                values: [unavailable_in_current_snapshot_not_scored, missing, populated]
      - name: billing_model_gap_status
        tests:
          - accepted_values:
              arguments:
                values: [unavailable_in_current_snapshot_not_scored, missing, populated]

  - name: mart_deal_cleanup_queue_live
    description: "Live-deal remediation queue; it never writes to HubSpot."
    columns:
      - name: deal_id
        tests: [not_null, unique]
      - name: review_priority
        tests:
          - accepted_values:
              arguments:
                values: [P1_active_value, P2_closed_won_history, P3_other]
      - name: deal_source_review_status
        tests:
          - accepted_values:
              arguments:
                values: [already_populated, high_confidence_first_touch, manual_review_required]

  - name: mart_deal_source_backfill_audit
    description: "Read-only reconstruction of the 621-deal Deal Source backfill population from current warehouse evidence."
    columns:
      - name: deal_id
        tests: [not_null, unique]
      - name: current_deal_source
        tests: [not_null]
      - name: first_touch_evidence
        tests: [not_null]

  - name: fct_customer_motion_live
    description: "One row per live closed-won deal; ARR motion is populated only from reviewed overrides."
    columns:
      - name: deal_id
        tests: [not_null, unique]
      - name: customer_motion
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [unclassified, net_new_arr, audit_to_arr_conversion, expansion, renewal, other_non_arr]
      - name: customer_motion_evidence_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [reviewed_override, needs_company_association, needs_product_or_service_lineage]
      - name: live_company_history_lifecycle
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [unmapped_company, first_known_company_win, repeat_company_win]

  - name: mart_customer_motion_review_queue_live
    description: "One row per unresolved live closed-won deal with evidence and reviewer guidance; read-only."
    columns:
      - name: deal_id
        tests: [not_null, unique]
      - name: customer_motion_evidence_status
        tests:
          - accepted_values:
              arguments:
                values: [needs_company_association, needs_product_or_service_lineage]
      - name: recommended_reviewer_action
        tests: [not_null]

  - name: mart_customer_motion_reporting_live
    description: "Investor-facing customer-motion and evidence-coverage summary, including zero rows for unmeasurable ARR categories."
    columns:
      - name: customer_motion
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [unclassified, net_new_arr, audit_to_arr_conversion, expansion, renewal, other_non_arr]
      - name: evidence_status
        tests: [not_null]
      - name: measurement_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [not_yet_measurable_no_reviewed_evidence, classification_required, measurable_from_reviewed_evidence]

  - name: mart_new_client_source_live
    description: "Acquisition source only for explicitly reviewed brand-new client ARR; empty when not measurable."
    columns:
      - name: acquisition_channel
        tests: [not_null]
      - name: attribution_evidence_status
        tests: [not_null]

  - name: fct_web_attribution_readiness_live
    description: "One row per live deal with deterministic form, contact, UTM, deal, and win evidence; no inferred bot labels."
    columns:
      - name: deal_id
        tests: [not_null, unique]
      - name: utm_evidence_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [clean_utm, missing_or_inferred_utm, corrupted_utm, unavailable_no_associated_contact]
      - name: web_form_evidence_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [predeal_form_evidence, form_evidence_after_deal_only, no_form_evidence, unavailable_no_associated_contact]
      - name: website_click_evidence_status
        tests:
          - accepted_values:
              arguments:
                values: [unavailable_not_collected]
      - name: bot_junk_signal_status
        tests:
          - accepted_values:
              arguments:
                values: [not_assessable_no_deterministic_fields]

  - name: mart_web_attribution_readiness_live
    description: "Investor-safe coverage summary by UTM and form-evidence status."
    columns:
      - name: utm_evidence_status
        tests: [not_null]
      - name: web_form_evidence_status
        tests: [not_null]

  - name: mart_web_funnel_coverage_live
    description: "Seven evidence checkpoints from live deal population through measurable form/UTM-to-win linkage."
    columns:
      - name: stage_order
        tests: [not_null, unique]
      - name: funnel_stage
        tests: [not_null, unique]
      - name: evidence_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [available_live_only, available, available_when_contact_linked, available_when_captured, available_when_both_captured, unavailable_not_collected]

  - name: mart_web_marketing_evidence_inventory
    description: "Warehouse evidence inventory with availability and investor-reporting scope."
    columns:
      - name: evidence_type
        tests: [not_null, unique]
      - name: availability
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [available, unavailable]
      - name: reporting_scope
        tests: [not_null]

  - name: stg_brand_inbound_lines
    description: "Historical brand inbound CSV rows verbatim, with parsed companions. Not CRM truth."
    columns:
      - name: line_id
        tests: [not_null, unique]
      - name: source_row_number
        tests: [not_null]
      - name: authorizes_crm_change
        tests:
          - accepted_values:
              arguments:
                values: [false]

  - name: stg_brand_inbound_twitter_crosscheck
    description: "Twitter/X historical-vs-PDF cross-check, one row per CSV Twitter deal."
    columns:
      - name: deal_id
        tests: [not_null, unique]
      - name: crosscheck_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [CROSSCHECKED, NOT_CROSSCHECKED]
      - name: overwrite_status
        tests:
          - accepted_values:
              arguments:
                values: [OVERWRITTEN, STILL_INTACT]
      - name: evidence_limitations
        tests: [not_null]
      - name: authorizes_crm_change
        tests:
          - accepted_values:
              arguments:
                values: [false]
