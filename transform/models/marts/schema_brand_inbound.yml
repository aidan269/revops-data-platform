version: 2

models:
  - name: mart_brand_inbound_evidence
    description: >
      Read-only comparison of historical brand inbound evidence against the latest
      HubSpot deal snapshot, joined on exact deal ID. Historical evidence never
      supersedes the live snapshot; agreement_status is a comparison result only.
    columns:
      - name: deal_id
        tests: [not_null, unique]
      - name: agreement_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - NO_LIVE_SNAPSHOT
                  - HISTORICAL_ONLY_NOT_CROSSCHECKED
                  - LIVE_SOURCE_NULL
                  - LIVE_MATCHES_PDF_OBSERVATION
                  - LIVE_DIFFERS_FROM_PDF_OBSERVATION
      - name: authorizes_crm_change
        tests:
          - accepted_values:
              arguments:
                values: [false]
